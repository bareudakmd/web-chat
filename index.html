<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 채팅방</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --border: #e5e8eb;
      --text: #191f28;
      --muted: #6b7684;
      --accent: #3182f6;
      --accent-hover: #1b64da;
      --mine: #e8f3ff;
      --other: #f2f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: min(980px, 96vw);
      height: min(720px, 94vh);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: grid;
      grid-template-columns: 240px 1fr;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: #fafbfc;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }
    .brand {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--mine);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .room-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .room-btn {
      border: none;
      background: transparent;
      text-align: left;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .room-btn:hover { background: #eef1f5; }
    .room-btn.active {
      background: var(--mine);
      color: var(--accent);
      font-weight: 600;
    }
    .nick-box {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nick-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .nick-input:focus { border-color: var(--accent); }
    .main {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title { font-weight: 700; font-size: 16px; }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-input {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      width: 170px;
      outline: none;
    }
    .btn-ghost {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-ghost:hover { background: #f2f4f6; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 74%;
      gap: 4px;
    }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.other { align-self: flex-start; align-items: flex-start; }
    .msg-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 6px;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--other);
    }
    .msg-row.mine .msg-bubble {
      background: var(--mine);
      color: #0b2d5c;
    }
    .msg-img {
      max-width: 260px;
      border-radius: 10px;
      margin-top: 4px;
      display: block;
    }
    .composer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: #fff;
    }
    .msg-input {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      max-height: 120px;
      outline: none;
    }
    .msg-input:focus { border-color: var(--accent); }
    .btn-send {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-send:hover { background: var(--accent-hover); }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span>웹 채팅방</span>
        <span class="badge">로컬·탭동기화</span>
      </div>
      <div>
        <div class="section-label">채팅방</div>
        <div class="room-list" id="roomList"></div>
      </div>
      <div class="nick-box">
        <div class="section-label">내 닉네임</div>
        <input class="nick-input" id="nickInput" placeholder="닉네임 입력" />
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-title" id="roomTitle"># 일반</div>
        <div class="header-actions">
          <input class="search-input" id="searchInput" placeholder="메시지 검색..." />
          <label class="btn-ghost" style="cursor:pointer;">
            사진
            <input type="file" id="imageInput" accept="image/*" hidden />
          </label>
          <button class="btn-ghost" id="exportBtn">내보내기</button>
          <button class="btn-ghost" id="clearBtn">비우기</button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composer">
        <textarea class="msg-input" id="msgInput" rows="1" placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button class="btn-send" type="submit">전송</button>
      </form>
    </main>
  </div>

  <script>
    const ROOMS = [
      { id: "general", name: "# 일반" },
      { id: "work", name: "# 업무메모" },
      { id: "free", name: "# 자유" }
    ];
    const STORAGE_KEY = "desktop_web_chat_v1";
    const NICK_KEY = "desktop_web_chat_nick";
    const channel = new BroadcastChannel("desktop_web_chat_channel");

    let currentRoom = "general";
    let searchQuery = "";
    let state = loadState();

    const roomListEl = document.getElementById("roomList");
    const roomTitleEl = document.getElementById("roomTitle");
    const messagesEl = document.getElementById("messages");
    const nickInput = document.getElementById("nickInput");
    const msgInput = document.getElementById("msgInput");
    const searchInput = document.getElementById("searchInput");
    const imageInput = document.getElementById("imageInput");

    nickInput.value = localStorage.getItem(NICK_KEY) || "나";
    nickInput.addEventListener("input", () => {
      localStorage.setItem(NICK_KEY, nickInput.value.trim() || "익명");
    });

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { general: [], work: [], free: [] };
      } catch {
        return { general: [], work: [], free: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      channel.postMessage({ type: "sync", state });
    }

    channel.onmessage = (e) => {
      if (e.data && e.data.type === "sync") {
        state = e.data.state;
        renderMessages();
        renderRooms();
      }
    };

    function renderRooms() {
      roomListEl.innerHTML = "";
      ROOMS.forEach((r) => {
        const btn = document.createElement("button");
        btn.className = "room-btn" + (r.id === currentRoom ? " active" : "");
        const count = (state[r.id] || []).length;
        btn.innerHTML = `<span>${r.name}</span><span style="font-size:11px;color:#8b95a1;">${count}</span>`;
        btn.onclick = () => {
          currentRoom = r.id;
          roomTitleEl.textContent = r.name;
          renderRooms();
          renderMessages();
        };
        roomListEl.appendChild(btn);
      });
    }

    function renderMessages() {
      const list = (state[currentRoom] || []).filter((m) =>
        !searchQuery || (m.text && m.text.toLowerCase().includes(searchQuery.toLowerCase())) || m.sender.toLowerCase().includes(searchQuery.toLowerCase())
      );
      const myNick = nickInput.value.trim() || "익명";
      messagesEl.innerHTML = "";
      if (!list.length) {
        messagesEl.innerHTML = `<div class="empty">대화가 아직 없습니다.<br/>새 탭을 하나 더 열면 같은 브라우저 탭끼리 실시간으로 동기화됩니다.</div>`;
        return;
      }
      list.forEach((m) => {
        const row = document.createElement("div");
        row.className = "msg-row " + (m.sender === myNick ? "mine" : "other");

        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = `${m.sender} · ${m.time}`;
        row.appendChild(meta);

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        if (m.text) bubble.textContent = m.text;
        if (m.image) {
          const img = document.createElement("img");
          img.src = m.image;
          img.className = "msg-img";
          bubble.appendChild(img);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, image = null) {
      const sender = nickInput.value.trim() || "익명";
      const now = new Date();
      const time = now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      if (!state[currentRoom]) state[currentRoom] = [];
      state[currentRoom].push({ sender, text, image, time });
      saveState();
      renderRooms();
      renderMessages();
    }

    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      addMessage(text);
      msgInput.value = "";
      msgInput.style.height = "auto";
    });

    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("composer").dispatchEvent(new Event("submit"));
      }
    });

    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value.trim();
      renderMessages();
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => addMessage("", reader.result);
      reader.readAsDataURL(file);
      imageInput.value = "";
    });

    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(state[currentRoom] || [], null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `chat-${currentRoom}.json`;
      a.click();
    };

    document.getElementById("clearBtn").onclick = () => {
      if (!confirm("현재 방의 대화 내역을 비울까요?")) return;
      state[currentRoom] = [];
      saveState();
      renderRooms();
      renderMessages();
    };

    renderRooms();
    renderMessages();
  </script>
</body>
</html>
